apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trackzyn.fullname" . }}-backend
  labels:
    {{- include "trackzyn.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "trackzyn.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/common/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "trackzyn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command:
            - node
            - dist/server.js
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: {{ include "trackzyn.fullname" . }}-config
            - secretRef:
                {{- if .Values.global.existingSecret }}
                name: {{ .Values.global.existingSecret }}
                {{- else }}
                name: {{ include "trackzyn.fullname" . }}-secrets
                {{- end }}
          volumeMounts:
            {{- if .Values.persistence.files.enabled }}
            - name: files
              mountPath: /app/data/files
            {{- end }}
          {{- if .Values.backend.resources }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.persistence.files.enabled }}
        - name: files
          persistentVolumeClaim:
            claimName: {{ include "trackzyn.fullname" . }}-files
        {{- end }}
