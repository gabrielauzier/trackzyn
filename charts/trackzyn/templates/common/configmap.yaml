apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trackzyn.fullname" . }}-config
  labels:
    {{- include "trackzyn.labels" . | nindent 4 }}
data:
  FRONTEND_URL: {{ include "trackzyn.frontendUrl" . | quote }}
  {{- range $key, $value := .Values.config }}
  {{ $key | snakecase | upper }}: {{ tpl (print $value) $ | quote }}
  {{- end }}
