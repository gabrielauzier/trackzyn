# Default values for trackzyn.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # The public domain of the application (e.g., trackzyn.local, app.example.com)
  domain: "trackzyn.local"
  # Set to true if the application is accessed over HTTPS (changes generated URLs)
  tls: false

  # For production, we recommend passing existingSecret instead of creating one via Helm values
  # existingSecret: "trackzyn-secrets"

# If existingSecret is NOT set, this secret will be created with the values below
secret:
  # MUST change in production
  secretKey: "dev-secret-change-in-production"
  # If postgresql.enabled is true, the internal database will be deployed.
  # If postgresql.enabled is false, you must provide your external database URL here or in existingSecret.
  databaseUrl: 'postgresql+asyncpg://postgres:postgres@{{ include "trackzyn.fullname" . }}-postgresql:5432/trackzyn'

  # OIDC
  oidcClientId: ""
  oidcClientSecret: ""

# Non-sensitive configuration (each key becomes an UPPER_SNAKE env var)
config:
  debug: "false"
  # Set false only when oidc.enabled, oidc.clientId, and oidc.discoveryUrl are configured.
  localAuthEnabled: "true"
  registrationEnabled: "true"
  oidcEnabled: "false"
  oidcProviderName: "OIDC"
  oidcDiscoveryUrl: ""
  oidcRedirectUri: ""
  oidcScopes: "openid email profile"
  oidcAutoRegister: "true"
  # Link OIDC logins to existing accounts with the same email: disabled, verified_email, or email
  oidcExistingUserLinkMode: "disabled"
  oidcRequireVerifiedEmail: "true"
  oidcSyncRoles: "false"
  oidcRolesClaim: "groups"
  oidcAdminRoles: ""
  oidcWorkspaceRoleMap: ""
  # "owner/repo" whose GitHub releases drive the update banner; empty disables it
  updateCheckRepo: ""

  # Redis configuration
  # If redis.enabled is true, the internal redis will be deployed.
  # If redis.enabled is false, you must provide your external Redis URL here.
  redisUrl: 'redis://{{ include "trackzyn.fullname" . }}-redis-master:6379/0'

  storageLocalPath: "/app/data/files"
  storageMaxFileSizeMb: "10"
  storageAllowedExtensions: "jpg,jpeg,png,webp,gif,heic,pdf"

# Backend configuration
backend:
  replicaCount: 1
  image:
    repository: ghcr.io/your-org/trackzyn-backend-node
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Frontend configuration
frontend:
  backendUrl: ""
  replicaCount: 1
  image:
    repository: ghcr.io/your-org/trackzyn-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Worker configuration
worker:
  enabled: true
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Scheduler configuration
scheduler:
  enabled: true
  image:
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Persistence for uploaded files
# IMPORTANT: Backend, Worker and Beat share the same files volume, so they
# mount this PVC concurrently. If your pods are scheduled across multiple nodes,
# you MUST use a StorageClass that supports `ReadWriteMany` (RWX) access mode
# (e.g., NFS, CephFS). `ReadWriteOnce` only works when all pods share one node.
persistence:
  files:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# Standard Kubernetes Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  tls: []
  #  - secretName: trackzyn-tls
  #    hosts:
  #      - trackzyn.local

httpRoute:
  enabled: false
  parentRefs: []
  # - name: external-gateway
  #   namespace: gateway-system
  # Path matches will route /api to backend and / to frontend.

# Simple StatefulSet for PostgreSQL
postgresql:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  resources: {}

# Simple StatefulSet for Redis
redis:
  enabled: true
  image:
    repository: docker.io/library/redis
    tag: 8-alpine
    pullPolicy: IfNotPresent
  resources: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
