{{- if .Values.celeryWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "launchkit.fullname" . }}-worker
  labels:
    {{- include "launchkit.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ if eq (include "launchkit.backendStack" .) "node" }}worker{{ else }}celery-worker{{ end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.celeryWorker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "launchkit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ if eq (include "launchkit.backendStack" .) "node" }}worker{{ else }}celery-worker{{ end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/common/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "launchkit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ if eq (include "launchkit.backendStack" .) "node" }}worker{{ else }}celery-worker{{ end }}
    spec:
      containers:
        - name: {{ if eq (include "launchkit.backendStack" .) "node" }}worker{{ else }}celery-worker{{ end }}
          image: "{{ include "launchkit.backendImage" . }}"
          imagePullPolicy: {{ .Values.celeryWorker.image.pullPolicy }}
          command:
            {{- if eq (include "launchkit.backendStack" .) "node" }}
            - node
            - dist/worker.js
            {{- else }}
            - celery
            - -A
            - app.worker
            - worker
            - --loglevel=info
            - --concurrency=2
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "launchkit.fullname" . }}-config
            - secretRef:
                {{- if .Values.global.existingSecret }}
                name: {{ .Values.global.existingSecret }}
                {{- else }}
                name: {{ include "launchkit.fullname" . }}-secrets
                {{- end }}
          volumeMounts:
            {{- if .Values.persistence.files.enabled }}
            - name: files
              mountPath: /app/data/files
            {{- end }}
          {{- if .Values.celeryWorker.resources }}
          resources:
            {{- toYaml .Values.celeryWorker.resources | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.persistence.files.enabled }}
        - name: files
          persistentVolumeClaim:
            claimName: {{ include "launchkit.fullname" . }}-files
        {{- end }}
{{- end }}
