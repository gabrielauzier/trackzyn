{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "launchkit.fullname" . }}-worker
  labels:
    {{- include "launchkit.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "launchkit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/common/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "launchkit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command:
            - node
            - dist/worker.js
          envFrom:
            - configMapRef:
                name: {{ include "launchkit.fullname" . }}-config
            - secretRef:
                {{- if .Values.global.existingSecret }}
                name: {{ .Values.global.existingSecret }}
                {{- else }}
                name: {{ include "launchkit.fullname" . }}-secrets
                {{- end }}
          volumeMounts:
            {{- if .Values.persistence.files.enabled }}
            - name: files
              mountPath: /app/data/files
            {{- end }}
          {{- if .Values.worker.resources }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.persistence.files.enabled }}
        - name: files
          persistentVolumeClaim:
            claimName: {{ include "launchkit.fullname" . }}-files
        {{- end }}
{{- end }}
