# Images are published by .github/workflows/release.yml. Point IMAGE_PREFIX at
# your registry (e.g. ghcr.io/acme/launchkit) and pin APP_VERSION to a tag.
x-python-image: &python-image
  image: ${IMAGE_PREFIX:-ghcr.io/your-org/launchkit}-backend:${APP_VERSION:-latest}

services:
  backend:
    <<: *python-image
    extends: { file: compose/prod/common.yml, service: backend-common }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    extends: { file: compose/prod/common.yml, service: frontend-common }
    depends_on:
      - backend

  celery-worker:
    <<: *python-image
    extends: { file: compose/prod/common.yml, service: backend-common }
    # Limit to 2 workers to save RAM (default = number of CPUs).
    command: celery -A app.worker worker --loglevel=info --concurrency=2

  celery-beat:
    <<: *python-image
    extends: { file: compose/prod/common.yml, service: backend-common }
    command: celery -A app.worker beat --loglevel=info
